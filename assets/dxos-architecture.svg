<text class="note" x="16" y="944">Source: một backend modular monolith.</text>
<text class="note" x="16" y="968">README chọn MinIO; SeaweedFS chờ duyệt.</text>
<text class="note" x="16" y="992">Available: source/demo; chưa full browser E2E.</text>
<text class="note" x="16" y="1016">Self-configured: prerequisite; chưa chứng minh chạy.</text>
<text class="note" x="16" y="1040">H/P: chưa xác nhận toàn bộ năng lực của đề.</text>
<text class="note" x="8" y="1088">Nét đứt: thiếu triển khai hoặc nghiệm thu.</text>
<text class="note" x="8" y="1110">Không có thành phần nào gắn nhãn LIVE.</text></svg>
