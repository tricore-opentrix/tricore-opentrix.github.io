<g><rect class="node pending" x="16" y="462" width="328" height="64" rx="8"/><text x="26" y="486" class="label">APISIX · gateway mục tiêu</text><text x="26" y="509" class="chip">Not yet</text></g>
<path class="edge" d="M180 526v16H95v18m85-18h85v18"/>
<g><rect class="node pending" x="16" y="560" width="158" height="64" rx="8"/><text x="26" y="584" class="label">core-service</text><text x="26" y="607" class="chip">Not yet</text></g><g><rect class="node pending" x="186" y="560" width="158" height="64" rx="8"/><text x="196" y="584" class="label">helpdesk-service</text><text x="196" y="607" class="chip">Not yet</text></g>
<text class="note" x="16" y="651">Hai service: mục tiêu #5, chưa runtime.</text>
<g><rect class="node pending" x="16" y="670" width="158" height="64" rx="8"/><text x="26" y="694" class="label">Keycloak · SSO</text><text x="26" y="717" class="chip">Self-configured</text></g><g><rect class="node pending" x="186" y="670" width="158" height="64" rx="8"/><text x="196" y="694" class="label">Workflow API</text><text x="196" y="717" class="chip">Not yet</text></g>
<g><rect class="node" x="16" y="758" width="158" height="64" rx="8"/><text x="26" y="782" class="label">PostgreSQL 17</text><text x="26" y="805" class="chip">Self-configured</text></g><g><rect class="node pending" x="186" y="758" width="158" height="64" rx="8"/><text x="196" y="782" class="label">SeaweedFS</text><text x="196" y="805" class="chip">Not yet</text></g>
